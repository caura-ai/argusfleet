[project]
name = "argusfleet"
version = "0.1.0"
description = "Research harness for governed shared memory in multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Caura" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
argusfleet = "argusfleet.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package code lives at the repo root (per the spec layout) rather
# than in a sub-directory. Use ``force-include`` to remap each item into
# an ``argusfleet/`` directory inside the wheel so the package is
# importable as ``import argusfleet`` after install.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "argusfleet/__init__.py"
"__main__.py" = "argusfleet/__main__.py"
"cli.py" = "argusfleet/cli.py"
"harness" = "argusfleet/harness"
"experiments" = "argusfleet/experiments"
"configs" = "argusfleet/configs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
